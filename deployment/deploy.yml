apiVersion: apps/v1
kind: Deployment
metadata:
  name: node-app

spec:
  replicas: 2
  selector:
    matchLabels:
      app: node-app
  template:
    metadata:
      labels:
        app: node-app
    spec:
      containers:
        - name: node-app
          image: mudassar9530/node-app:18
          ports:
            - containerPort: 8085
